<!DOCTYPE html>  
<html lang="ru">  
<head>  
    <meta charset="UTF-8" />  
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
    <title>Приглашение на свидание ❤️</title>  
    <style>  
        * {  
            margin: 0;  
            padding: 0;  
            box-sizing: border-box;  
        }  
        body {  
            min-height: 100vh;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            background: linear-gradient(145deg, #1a0b1f 0%, #2d1b33 100%);  
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;  
            padding: 20px;  
        }  
        .card {  
            max-width: 520px;  
            width: 100%;  
            background: rgba(255, 248, 245, 0.92);  
            backdrop-filter: blur(6px);  
            padding: 40px 30px 45px;  
            border-radius: 48px 48px 48px 48px;  
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 200, 200, 0.2);  
            text-align: center;  
            transition: 0.3s;  
            border: 1px solid rgba(255, 180, 180, 0.3);  
        }  
        .emoji-big {  
            font-size: 72px;  
            line-height: 1.2;  
            margin-bottom: 8px;  
            display: block;  
        }  
        h1 {  
            font-size: 32px;  
            font-weight: 700;  
            color: #3b1f3f;  
            letter-spacing: -0.5px;  
            margin-bottom: 8px;  
        }  
        .sub {  
            font-size: 19px;  
            font-weight: 400;  
            color: #5a3d5e;  
            margin-bottom: 12px;  
            background: rgba(255, 220, 220, 0.3);  
            padding: 6px 16px;  
            border-radius: 40px;  
            display: inline-block;  
            backdrop-filter: blur(2px);  
        }  
        .question {  
            font-size: 20px;  
            font-weight: 500;  
            color: #2d1b2f;  
            margin: 16px 0 28px;  
            line-height: 1.5;  
            padding: 0 6px;  
        }  
        .btn-group {  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            gap: 30px;  
            flex-wrap: wrap;  
            margin-top: 10px;  
        }  
        .btn {  
            border: none;  
            padding: 16px 44px;  
            font-size: 24px;  
            font-weight: 600;  
            border-radius: 100px;  
            cursor: pointer;  
            transition: 0.2s;  
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);  
            letter-spacing: 0.5px;  
            min-width: 130px;  
            touch-action: manipulation;  
        }  
        .btn-yes {  
            background: #e8436e;  
            color: white;  
        }  
        .btn-yes:hover {  
            transform: scale(1.04);  
            background: #d63b62;  
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25);  
        }  
        .btn-yes:active {  
            transform: scale(0.96);  
        }  
        .btn-no {  
            background: #444;  
            color: white;  
            position: relative;  
            transition: all 0.18s ease;  
        }  
        .btn-no:hover {  
            background: #555;  
        }  
        .footer-message {  
            margin-top: 32px;  
            font-size: 18px;  
            color: #4d2f52;  
            background: rgba(255, 215, 215, 0.25);  
            padding: 14px 12px;  
            border-radius: 60px;  
            backdrop-filter: blur(2px);  
            border: 1px dashed rgba(180, 100, 120, 0.3);  
            display: none;  
            font-weight: 500;  
        }  
        .footer-message.show {  
            display: block;  
        }  
        .hearts-bg {  
            position: fixed;  
            top: 0;  
            left: 0;  
            width: 100%;  
            height: 100%;  
            pointer-events: none;  
            z-index: 999;  
            overflow: hidden;  
        }  
        .heart-fly {  
            position: absolute;  
            font-size: 28px;  
            animation: floatUp 4s ease-in forwards;  
            opacity: 0.9;  
            user-select: none;  
        }  
        @keyframes floatUp {  
            0% {  
                transform: translateY(0) scale(0.6) rotate(0deg);  
                opacity: 1;  
            }  
            100% {  
                transform: translateY(-800px) scale(1.6) rotate(40deg);  
                opacity: 0;  
            }  
        }  
        @media (max-width: 480px) {  
            .card {  
                padding: 28px 18px 32px;  
            }  
            .btn {  
                padding: 14px 28px;  
                font-size: 20px;  
                min-width: 100px;  
            }  
            .btn-group {  
                gap: 16px;  
            }  
            h1 {  
                font-size: 26px;  
            }  
            .emoji-big {  
                font-size: 56px;  
            }  
        }  
    </style>  
</head>  
<body>  
  
    <div class="hearts-bg" id="heartsContainer"></div>  
  
    <div class="card">  
        <span class="emoji-big">🌹</span>  
        <h1>Привет, красотка</h1>  
        <div class="sub">💌 личное приглашение</div>  
        <div class="question">  
            Ты пойдёшь со мной на свидание?<br />  
            <span style="font-size: 26px; display: block; margin-top: 8px;">🥂✨</span>  
        </div>  
  
        <div class="btn-group" id="btnGroup">  
            <button class="btn btn-yes" id="yesBtn">ДА</button>  
            <button class="btn btn-no" id="noBtn">НЕТ</button>  
        </div>  
  
        <div class="footer-message" id="responseMessage">  
            ❤️ Ты сделала мой день! Жду с нетерпением ❤️  
        </div>  
    </div>  
  
    <script>  
        (function() {  
            const yesBtn = document.getElementById('yesBtn');  
            const noBtn = document.getElementById('noBtn');  
            const responseMsg = document.getElementById('responseMessage');  
            const heartsContainer = document.getElementById('heartsContainer');  
  
            // Функция для запуска летающих сердечек  
            function launchHearts(count = 30) {  
                const emojis = ['❤️', '💖', '💕', '💗', '💘', '💝', '✨'];  
                for (let i = 0; i < count; i++) {  
                    setTimeout(() => {  
                        const heart = document.createElement('div');  
                        heart.className = 'heart-fly';  
                        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];  
                        heart.style.left = Math.random() * 100 + '%';  
                        heart.style.top = (85 + Math.random() * 15) + '%';  
                        heart.style.fontSize = (20 + Math.random() * 28) + 'px';  
                        heart.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';  
                        heartsContainer.appendChild(heart);  
                        // удаляем после анимации  
                        setTimeout(() => heart.remove(), 6000);  
                    }, i * 80);  
                }  
            }  
  
            // Обработчик "ДА"  
            yesBtn.addEventListener('click', function(e) {  
                e.preventDefault();  
                // Показываем сообщение  
                responseMsg.classList.add('show');  
                responseMsg.innerHTML = '❤️ Ты сделала мой день! Жду с нетерпением ❤️<br /><span style="font-size:32px;">🥰💋</span>';  
                // Запускаем море сердечек  
                launchHearts(45);  
                // Делаем кнопки неактивными (нельзя повторно нажать)  
                yesBtn.disabled = true;  
                noBtn.disabled = true;  
                yesBtn.style.opacity = '0.6';  
                noBtn.style.opacity = '0.4';  
                noBtn.style.transform = 'scale(0.95)';  
            });  
  
            // Убегающая кнопка "НЕТ"  
            let noBtnHoverCount = 0;  
            const maxNoAttempts = 8;  
  
            function moveNoButton() {  
                if (noBtn.disabled) return;  
  
                const card = document.querySelector('.card');  
                const cardRect = card.getBoundingClientRect();  
                const btnRect = noBtn.getBoundingClientRect();  
  
                // Границы внутри карточки, чтобы кнопка не вылезала  
                const padding = 10;  
                const maxX = cardRect.width - btnRect.width - padding;  
                const maxY = cardRect.height - btnRect.height - padding;  
  
                // Случайное смещение относительно текущей позиции  
                const currentLeft = parseFloat(noBtn.style.left) || 0;  
                const currentTop = parseFloat(noBtn.style.top) || 0;  
  
                let newX = currentLeft + (Math.random() * 140 - 70);  
                let newY = currentTop + (Math.random() * 140 - 70);  
  
                // Ограничиваем, чтобы не выходило за карточку  
                newX = Math.min(Math.max(newX, 0), maxX);  
                newY = Math.min(Math.max(newY, 0), maxY);  
  
                noBtn.style.position = 'relative';  
                noBtn.style.left = newX + 'px';  
                noBtn.style.top = newY + 'px';  
  
                noBtnHoverCount++;  
                if (noBtnHoverCount >= maxNoAttempts) {  
                    // Меняем текст на "Ладно, уговорил"  
                    noBtn.textContent = '😏 Ладно...';  
                    noBtn.style.background = '#e8436e';  
                    noBtn.style.color = 'white';  
                    noBtn.style.transform = 'scale(1.05)';  
                    // Через 0.8 сек возвращаем как ДА  
                    setTimeout(() => {  
                        if (!noBtn.disabled) {  
                            noBtn.textContent = 'ДА ❤️';  
                            noBtn.style.background = '#e8436e';  
                            noBtn.style.left = '0px';  
                            noBtn.style.top = '0px';  
                            noBtn.style.transform = 'scale(1)';  
                            // Автоматический клик по ДА  
                            yesBtn.click();  
                        }  
                    }, 800);  
                }  
            }  
  
            // События для кнопки "НЕТ"  
            noBtn.addEventListener('mouseenter', function(e) {  
                if (!noBtn.disabled) {  
                    moveNoButton();  
                }  
            });  
  
            noBtn.addEventListener('touchstart', function(e) {  
                if (!noBtn.disabled) {  
                    e.preventDefault();  
                    moveNoButton();  
                }  
            });  
  
            // Клик по "НЕТ" тоже активирует движение  
            noBtn.addEventListener('click', function(e) {  
                if (!noBtn.disabled) {  
                    e.preventDefault();  
                    moveNoButton();  
                }  
            });  
  
            // Начальная инициализация позиции  
            window.addEventListener('load', function() {  
                noBtn.style.position = 'relative';  
                noBtn.style.left = '0px';  
                noBtn.style.top = '0px';  
                // Небольшой сброс для адаптивности  
                setTimeout(() => {  
                    const card = document.querySelector('.card');  
                    const btnRect = noBtn.getBoundingClientRect();  
                    const cardRect = card.getBoundingClientRect();  
                    if (btnRect.right > cardRect.right - 10) {  
                        noBtn.style.left = '-10px';  
                    }  
                }, 200);  
            });  
  
            // Дополнительно: если окно меняет размер — сбрасываем позицию кнопки "Нет"  
            window.addEventListener('resize', function() {  
                if (!noBtn.disabled) {  
                    noBtn.style.left = '0px';  
                    noBtn.style.top = '0px';  
                }  
            });  
  
        })();  
    </script>  
  
</body>  
</html>
